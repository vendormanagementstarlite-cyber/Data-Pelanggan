<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Data Mitra - Starlite</title>
  <style>
    :root {
      --navy-deep: #06091A;
      --gold: #D8A83C;
      --gold-soft: #ECC468;
      --muted: #8C9AC2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--navy-deep);
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Layar loading, tampil sampai iframe selesai dimuat */
    #loadingScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(circle at 12% -10%, rgba(216,168,60,0.09) 0%, transparent 42%),
        radial-gradient(circle at 88% 4%, rgba(79,184,245,0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 0%, #17305F 0%, var(--navy-deep) 55%),
        var(--navy-deep);
      z-index: 10;
      transition: opacity 0.35s ease;
    }
    #loadingScreen.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(216,168,60,0.2);
      border-top-color: var(--gold);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingScreen p {
      color: var(--muted);
      font-size: 13.5px;
      margin: 0;
      text-align: center;
      padding: 0 24px;
    }
    #loadingScreen a {
      color: var(--gold-soft);
      font-size: 12.5px;
      text-decoration: none;
      margin-top: 4px;
    }
    #loadingScreen a:hover { text-decoration: underline; }

    /* Tampil hanya jika iframe gagal dimuat (misalnya diblokir jaringan/browser) */
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: var(--navy-deep);
      z-index: 11;
      padding: 24px;
      text-align: center;
    }
    #fallback.show { display: flex; }
    #fallback p { color: var(--muted); font-size: 14px; max-width: 360px; margin: 0; }
    #fallback a.btn {
      background: linear-gradient(90deg, #B4862C, var(--gold-soft));
      color: #1D1503;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 26px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Memuat Portal Data Mitra...</p>
    <a href="https://script.google.com/macros/s/AKfycbyICWUHYy7-KGLNR2S93NP1tOEeF8TACHFIt99uYt21kvdcRew1zrRxAMBG-ycUDJZaKw/exec" target="_top">Lama menunggu? Buka langsung di sini</a>
  </div>

  <div id="fallback">
    <p>Portal tidak bisa ditampilkan di halaman ini. Klik tombol di bawah untuk membukanya langsung.</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbyICWUHYy7-KGLNR2S93NP1tOEeF8TACHFIt99uYt21kvdcRew1zrRxAMBG-ycUDJZaKw/exec" target="_top">Buka Portal Data Mitra</a>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyICWUHYy7-KGLNR2S93NP1tOEeF8TACHFIt99uYt21kvdcRew1zrRxAMBG-ycUDJZaKw/exec"
    title="Portal Data Mitra Starlite"
    allow="clipboard-write"
  ></iframe>

  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbyICWUHYy7-KGLNR2S93NP1tOEeF8TACHFIt99uYt21kvdcRew1zrRxAMBG-ycUDJZaKw/exec';
    var frame = document.getElementById('appFrame');
    var loadingScreen = document.getElementById('loadingScreen');
    var fallback = document.getElementById('fallback');
    var loaded = false;

    frame.addEventListener('load', function () {
      loaded = true;
      loadingScreen.classList.add('hide');
      setTimeout(function () { loadingScreen.style.display = 'none'; }, 400);
    });

    // Kalau dalam 8 detik iframe belum juga selesai load (kemungkinan diblokir), tampilkan tombol fallback
    setTimeout(function () {
      if (!loaded) {
        loadingScreen.style.display = 'none';
        fallback.classList.add('show');
      }
    }, 8000);
  </script>
</body>
</html>
